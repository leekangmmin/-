name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m py_compile app/*.py desktop/*.py scripts/*.py

      - name: Repository hygiene check
        run: |
          if git ls-files | grep -E '(\.db$|\.sqlite$|\.sqlite3$|\.env$|\.gguf$|\.safetensors$|\.onnx$|\.pt$|\.pth$|\.dmg$|\.zip$|\.exe$|\.msi$|\.app/|NativeMacApp/\.build/|(^|/)dist/|(^|/)build/|OPENCODE_RESULT\.md$|\.tmp$)'; then
            echo "Tracked release artifact, DB, model, secret, or temporary file detected."
            exit 1
          fi

      - name: Run tests
        run: pytest -q

      - name: Scoring quality gate
        run: python -m tests.eval_harness

      - name: Local AI dry-run
        run: python scripts/run_local_ai_validation.py --dry-run
